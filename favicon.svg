<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grid-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="100" height="100" rx="24" fill="url(#bg-grad)" />
  <rect x="6" y="6" width="88" height="88" rx="20" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
  
  <!-- Mini 3x3 Grid Dots / Cells -->
  <rect x="20" y="20" width="16" height="16" rx="4" fill="url(#grid-grad)" />
  <rect x="42" y="20" width="16" height="16" rx="4" fill="#1e293b" />
  <rect x="64" y="20" width="16" height="16" rx="4" fill="url(#grid-grad)" />
  
  <rect x="20" y="42" width="16" height="16" rx="4" fill="#1e293b" />
  <rect x="42" y="42" width="16" height="16" rx="4" fill="url(#grid-grad)" />
  <rect x="64" y="42" width="16" height="16" rx="4" fill="#1e293b" />
  
  <rect x="20" y="64" width="16" height="16" rx="4" fill="url(#grid-grad)" />
  <rect x="42" y="64" width="16" height="16" rx="4" fill="#1e293b" />
  <rect x="64" y="64" width="16" height="16" rx="4" fill="url(#grid-grad)" />
</svg>
